name: Task integration
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  task-integration:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: fbf7db1c10436cbb9d91e71526f4edb880ce8349
          path: .tmp/lvce-editor
      - uses: actions/setup-node@v6
        with:
          node-version: '26.9.0'
      - name: Install application dependencies
        working-directory: .tmp/lvce-editor
        run: npm ci
        env:
          DOWNLOAD_BUILTIN_EXTENSIONS: 0
      - name: Download built-in extensions
        working-directory: .tmp/lvce-editor
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node packages/build/src/parts/DownloadBuiltinExtensions/DownloadBuiltinExtensions.ts; then
              exit 0
            fi
          done
          exit 1
      - name: Install Chromium
        working-directory: .tmp/lvce-editor/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Prepare task integration
        run: node packages/editor-integration/prepare.mjs .tmp/lvce-editor
      - name: Type-check task integration
        run: npx tsc -p packages/editor-integration/tsconfig.json --pretty false
      - name: Build application static export
        working-directory: .tmp/lvce-editor
        run: npm run build:static:ignore-icon-theme
        env:
          PATH_PREFIX: /lvce-editor
      - name: Build server and verify static export
        working-directory: .tmp/lvce-editor
        run: |
          npm run build:server
          npm run test-static-export
      - name: Test default build task
        working-directory: .tmp/lvce-editor/packages/extension-host-worker-tests
        shell: bash
        run: node src/_all.js --ci --headless --test-name-prefix=tasks.run-default-build-task
